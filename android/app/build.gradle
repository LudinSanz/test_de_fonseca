plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
def parsedVersionCode = 7
if (flutterVersionCode != null && flutterVersionCode.isInteger()) {
    parsedVersionCode = flutterVersionCode.toInteger()
}

def flutterVersionName = localProperties.getProperty('flutter.versionName') ?: '1.0.6'

android {
    namespace "com.example.test_de_fonseca"
    compileSdk 34

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    defaultConfig {
        applicationId "com.example.test_de_fonseca"
        minSdk 21
        targetSdk 34
        versionCode parsedVersionCode
        versionName flutterVersionName
    }

    signingConfigs {
        debug {
            def homeKeystore = file(System.getProperty("user.home") + "/.android/debug.keystore")
            def localKeystore = file("debug.keystore")
            if (homeKeystore.exists()) {
                storeFile homeKeystore
            } else if (localKeystore.exists()) {
                storeFile localKeystore
            } else {
                storeFile file(System.getProperty("user.home") + "/.android/debug.keystore")
            }
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.debug
            minifyEnabled false
            shrinkResources false
        }
    }
}

flutter {
    source "../.."
}
