pluginManagement {
    def flutterSdkPath = {
        def properties = new Properties()
        def localPropertiesFile = new File(settingsDir, "local.properties")
        if (localPropertiesFile.exists()) {
            localPropertiesFile.withReader('UTF-8') { reader ->
                properties.load(reader)
            }
        }
        def sdkPath = properties.getProperty("flutter.sdk")
        if (sdkPath == null || sdkPath.isEmpty()) {
            sdkPath = System.getenv("FLUTTER_ROOT") ?: System.getenv("FLUTTER_HOME") ?: System.getenv("FLUTTER_SDK_PATH")
        }
        if (sdkPath == null || sdkPath.isEmpty()) {
            def hostedCache = new File("/opt/hostedtoolcache/flutter/3.24.0-stable/x64")
            if (hostedCache.exists()) {
                sdkPath = hostedCache.absolutePath
            }
        }
        if (sdkPath == null || sdkPath.isEmpty()) {
            try {
                def cmd = System.getProperty("os.name").toLowerCase().contains("win") ? "where flutter" : "which flutter"
                def flutterBin = cmd.execute().text.trim().split("\n")[0].trim()
                if (flutterBin && new File(flutterBin).exists()) {
                    sdkPath = new File(flutterBin).parentFile?.parentFile?.absolutePath
                }
            } catch (Exception ignored) {}
        }
        if (sdkPath == null || sdkPath.isEmpty()) {
            throw new GradleException("Flutter SDK not found. Define location with flutter.sdk in local.properties or FLUTTER_ROOT environment variable.")
        }
        return sdkPath
    }()

    includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id "dev.flutter.flutter-plugin-loader" version "1.0.0"
    id "dev.flutter.flutter-gradle-plugin" apply false
    id "com.android.application" version "8.2.1" apply false
    id "org.jetbrains.kotlin.android" version "1.9.24" apply false
}

include ":app"
