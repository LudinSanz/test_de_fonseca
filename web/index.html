<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ATM - Test de Fonseca</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0066cc, #004799);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 500px;
            text-align: center;
        }

        .login-container {
            background-color: white;
            border-radius: 15px;
            padding: 35px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            color: #333;
            margin-bottom: 30px;
        }

        .logo {
            width: 80px;
            height: 80px;
            background-color: #0066cc;
            border-radius: 50%;
            margin: 0 auto 15px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .logo i {
            font-size: 40px;
            color: white;
        }

        h1 {
            color: #0066cc;
            margin-bottom: 10px;
            font-size: 28px;
        }

        h2 {
            color: #666;
            margin-bottom: 25px;
            font-size: 18px;
            font-weight: normal;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
            position: relative;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-size: 14px;
            font-weight: 500;
        }

        input {
            width: 100%;
            padding: 15px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        input:focus {
            border-color: #0066cc;
            outline: none;
        }

        .password-container {
            position: relative;
        }

        .toggle-password {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #777;
        }

        .button-group {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            gap: 15px;
        }

        .btn {
            padding: 15px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: all 0.3s;
            flex: 1;
        }

        .btn-primary {
            background-color: #0066cc;
            color: white;
        }

        .btn-primary:hover {
            background-color: #0052a3;
        }

        .btn-secondary {
            background-color: #f2f2f2;
            color: #666;
        }

        .btn-secondary:hover {
            background-color: #e6e6e6;
        }

        .forgot-password {
            color: #0066cc;
            text-decoration: none;
            font-size: 14px;
            display: inline-block;
            margin-top: 10px;
        }

        .forgot-password:hover {
            text-decoration: underline;
        }

        .main-nav {
            display: flex;
            justify-content: space-around;
            background-color: rgba(255, 255, 255, 0.1);
            padding: 15px;
            border-radius: 10px;
            backdrop-filter: blur(10px);
        }

        .main-nav a {
            color: white;
            text-decoration: none;
            font-size: 16px;
            padding: 8px 12px;
            border-radius: 5px;
            transition: background-color 0.3s;
        }

        .main-nav a:hover {
            background-color: rgba(255, 255, 255, 0.2);
        }

        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 15px 20px;
            border-radius: 8px;
            background-color: #4CAF50;
            color: white;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            opacity: 0;
            transform: translateY(-20px);
            transition: opacity 0.3s, transform 0.3s;
            z-index: 1000;
        }

        .notification.error {
            background-color: #f44336;
        }

        .notification.show {
            opacity: 1;
            transform: translateY(0);
        }

        @media (max-width: 600px) {
            .login-container {
                padding: 25px;
            }
            
            .button-group {
                flex-direction: column;
            }
            
            .main-nav {
                flex-wrap: wrap;
            }
            
            .main-nav a {
                margin: 5px;
            }
        }

        @media (max-width: 400px) {
            .login-container {
                padding: 20px 15px;
            }
            
            h1 {
                font-size: 24px;
            }
            
            input {
                padding: 12px;
            }
            
            .btn {
                padding: 12px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="login-container">
            <div class="logo">
                <i class="fas fa-user-md"></i>
            </div>
            <h1>ATM - Test de Fonseca</h1>
            <h2>Bienvenido</h2>
            
            <form class="login-form" id="loginForm">
                <div class="form-group">
                    <label for="email">Correo</label>
                    <input type="email" id="email" placeholder="doctor@clinic.gt" required>
                </div>
                
                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <div class="password-container">
                        <input type="password" id="password" placeholder="Ingresa tu contraseña" required>
                        <span class="toggle-password" id="togglePassword">
                            <i class="far fa-eye"></i>
                        </span>
                    </div>
                </div>
                
                <div class="button-group">
                    <button type="submit" class="btn btn-primary">Entrar</button>
                    <button type="button" class="btn btn-secondary" id="registerBtn">Registrarse</button>
                </div>
                
                <a href="#" class="forgot-password">¿Olvidaste tu contraseña?</a>
            </form>
        </div>
        
        <nav class="main-nav">
            <a href="#"><i class="fas fa-home"></i> Inicio</a>
            <a href="#"><i class="fas fa-cog"></i> Config</a>
            <a href="#"><i class="fas fa-clipboard-check"></i> Evaluar</a>
            <a href="#"><i class="fas fa-tools"></i> Tools</a>
            <a href="#"><i class="fas fa-chart-bar"></i> Reportes</a>
        </nav>
    </div>
    
    <div class="notification" id="notification"></div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const loginForm = document.getElementById('loginForm');
            const emailInput = document.getElementById('email');
            const passwordInput = document.getElementById('password');
            const togglePassword = document.getElementById('togglePassword');
            const registerBtn = document.getElementById('registerBtn');
            const notification = document.getElementById('notification');
            
            // Función para mostrar notificaciones
            function showNotification(message, isError = false) {
                notification.textContent = message;
                notification.className = 'notification';
                if (isError) {
                    notification.classList.add('error');
                }
                notification.classList.add('show');
                
                setTimeout(() => {
                    notification.classList.remove('show');
                }, 3000);
            }
            
            // Alternar visibilidad de contraseña
            togglePassword.addEventListener('click', function() {
                const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
                passwordInput.setAttribute('type', type);
                
                // Cambiar icono
                const eyeIcon = this.querySelector('i');
                eyeIcon.className = type === 'password' ? 'far fa-eye' : 'far fa-eye-slash';
            });
            
            // Manejar envío del formulario
            loginForm.addEventListener('submit', function(e) {
                e.preventDefault();
                
                const email = emailInput.value.trim();
                const password = passwordInput.value.trim();
                
                // Validaciones básicas
                if (!email || !password) {
                    showNotification('Por favor, complete todos los campos', true);
                    return;
                }
                
                if (!isValidEmail(email)) {
                    showNotification('Por favor, ingrese un correo electrónico válido', true);
                    return;
                }
                
                // Simular inicio de sesión (en una aplicación real, esto se conectaría a un backend)
                simulateLogin(email, password);
            });
            
            // Validar formato de email
            function isValidEmail(email) {
                const re = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
                return re.test(email);
            }
            
            // Simular proceso de inicio de sesión
            function simulateLogin(email, password) {
                // Mostrar carga (en una aplicación real)
                const submitBtn = loginForm.querySelector('button[type="submit"]');
                const originalText = submitBtn.textContent;
                submitBtn.textContent = 'Iniciando sesión...';
                submitBtn.disabled = true;
                
                // Simular retraso de red
                setTimeout(() => {
                    // Credenciales "válidas" para la demostración
                    if (email === 'doctor@clinic.gt' && password === 'password123') {
                        showNotification('¡Inicio de sesión exitoso! Redirigiendo...');
                        // En una aplicación real, redirigiríamos al usuario a su dashboard
                    } else {
                        showNotification('Correo o contraseña incorrectos', true);
                    }
                    
                    // Restaurar botón
                    submitBtn.textContent = originalText;
                    submitBtn.disabled = false;
                }, 1500);
            }
            
            // Manejar clic en Registrarse
            registerBtn.addEventListener('click', function() {
                showNotification('Función de registro no implementada en esta demo');
            });
            
            // Rellenar con valores de ejemplo para prueba
            emailInput.value = 'doctor@clinic.gt';
            passwordInput.value = 'password123';
        });
    </script>
</body>
</html>
